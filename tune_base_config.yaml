experiment:
  name: tune_haunet_stage1_TRIAL_ID
  branch: viirs

data:
  bucket_name: wildfire-irp-data-th25
  output_prefix: processed_dataset_gcp
  splits_dir: splits_small_2000
  dilate_target: false
  goes_mean: [304.52951863959134, 295.51011064894595, 8.995863380755512]
  goes_std:  [13.284006695513591, 10.658734628298228, 7.259822851148247]
  dem_mean:  [0.3645237477164326]
  dem_std:   [0.5169181929171541]
  goes_channels: 3
  cov_channels: 11
  num_workers: 1
  use_stage1_pred: false
  stage1_channels: 0

model:
  name: haunet
  drop_out_rate: 0.1
  prior_fire_fraction: 0.0085
  use_cov_pyramid: true

loss:
  type: focal_dice
  alpha: 0.85
  gamma: 1.5
  focal_weight: 1.0
  dice_weight: 1.0
  smooth: 0.001
  tversky_alpha: 0.3
  tversky_beta: 0.7
  tversky_weight: 1.0
  gaussian_alpha: 2.0
  gaussian_beta: 4.0

training:
  batch_size: 2
  grad_accum_steps: 4
  epochs: 3
  learning_rate: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 5.0e-4
  grad_clip: 2.0
  val_every_n_epochs: 1
  save_every_n_epochs: 3
  use_weighted_sampler: false

evaluation:
  threshold: 0.5
  low_threshold: 0.3
  compute_ipsnr: true
  pixel_size_m: 384.0
  log_postprocessed: false

checkpointing:
  checkpoint_dir: checkpoints
  gcs_checkpoint_prefix: processed_dataset_gcp/checkpoints/tune_haunet_stage1
  keep_last_n: 1
  best_metric: val_auprc

logging:
  log_dir: logs
  use_wandb: false
