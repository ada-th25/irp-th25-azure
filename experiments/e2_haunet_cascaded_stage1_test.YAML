# experiments/e2_haunet_cascaded_stage1_test.yaml
# ===================================
# Stage 1 of the cascaded pipeline (GOES -> VIIRS), HAUNet, model/pipeline testing only.
# Purpose: verify the pipeline runs end-to-end and produces sane loss/IoU
# trends on a small subset, NOT a real experiment result.

experiment:
  name: e2_haunet_viirs_cascaded_stage1_test
  branch: viirs

data:
  bucket_name: wildfire-irp-data-th25
  output_prefix: processed_dataset_gcp
  splits_dir: splits_500_samples_test        # <- points at the subsampled 80/10/10 split,
                                   #    not the real 'splits/' full dataset
  goes_channels: 3                # C07, C14, GOES_TFI: unchanged by the resolution rework
  cov_channels: 2                 # DEM, land cover: unchanged by the resolution rework
  num_workers: 2                  # small pool, no need for many workers

training:
  batch_size: 2                   # keep tiny given the small split (train~16 at max-samples=20)
  grad_accum_steps: 4      # effective batch size = 2 * 4 = 8, same as intended
  epochs: 20
  learning_rate: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 2.0
  val_every_n_epochs: 1           # validate every epoch since there are so few
  save_every_n_epochs: 3          # save once, at the end

checkpointing:
  checkpoint_dir: checkpoints
  gcs_checkpoint_prefix: processed_dataset_gcp/checkpoints/e2_haunet_viirs_cascaded_stage1_test
  keep_last_n: 1                  # don't bother retaining history for a throwaway run

logging:
  log_dir: logs_smoke
  use_wandb: false                # keep smoke runs out of the real W&B project

loss:
  type: focal_tversky
  alpha: 0.75            # focal alpha, unchanged
  gamma: 2.0              # consider 3.0 if it still under-predicts fire
  tversky_alpha: 0.2       # false-positive weight
  tversky_beta: 0.85        # false-negative weight, penalizes missed fire pixels
  smooth: 1.0              # Tversky smoothing (not the same scale as old Dice smooth)
  focal_weight: 1.0
  tversky_weight: 1.0