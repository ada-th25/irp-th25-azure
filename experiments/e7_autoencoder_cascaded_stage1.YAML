experiment:
  name: e7_autoencoder_cascaded_stage1
  branch: viirs

model:
  name: autoencoder

data:
  bucket_name: wildfire-irp-data-th25
  output_prefix: processed_dataset_gcp
  splits_dir: splits_500_samples_test
  goes_channels: 3
  cov_channels: 2
  num_workers: 4

training:
  batch_size: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  epochs: 20
  min_lr: 1.0e-6
  grad_clip: 2.0
  grad_accum_steps: 4
  val_every_n_epochs: 1
  save_every_n_epochs: 3

# Configure CenterNet's penalty-reduced focal loss. 
# Use alpha (focusing parameter) and beta (penalty reduction parameter).
loss:
  type: gaussian_focal
  gaussian_alpha: 2.0
  gaussian_beta: 4.0

checkpointing:
  checkpoint_dir: checkpoints
  gcs_checkpoint_prefix: checkpoints/e7_autoencoder_cascaded_stage1
  keep_last_n: 3

logging:
  log_dir: logs
  use_wandb: False