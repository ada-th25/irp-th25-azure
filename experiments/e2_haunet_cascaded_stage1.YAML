# experiments/e2_haunet_cascaded_stage1.YAML
# ===================================
# Stage 1 of the cascaded pipeline (GOES -> VIIRS), HAUNet

# ==================================================================
# e2 haunet cascaded stage1 focal dice, with cov encoder, no target dilation
# ==================================================================
experiment:
  name: e2_haunet_cascaded_stage1_focal_dice
  branch: viirs

data:
  bucket_name: wildfire-irp-data-th25
  output_prefix: processed_dataset_gcp
  splits_dir: splits              # <- full 80/10/10 split, not the smoke-test subset
  heatmap_sigma: 1.2              # unused when heatmap_target: false, harmless to leave
  goes_mean: [304.52951863959134, 295.51011064894595, 8.995863380755512] # GOES stats calculated only from the train dataset
  goes_std: [13.284006695532215, 10.658734628311198, 7.259822851148196]
  dem_mean: [0.36452374771643253]
  dem_std: [0.5169181929171535]
  heatmap_target: false           # focal_dice expects a binary {0,1} target
  dilate_target: false            # consider true if fire pixels are too sparse for Dice to get gradient signal
  goes_channels: 3
  cov_channels: 11
  num_workers: 4
  use_stage1_pred: false
  stage1_channels: 0

model:
  name: haunet
  drop_out_rate: 0.1
  # prior_fire_fraction: <measured VIIRS positive-pixel fraction>
  # defaults to 0.0085 if omitted

training:
  batch_size: 2
  grad_accum_steps: 4             # effective batch size = 2 * 4 = 8
  epochs: 20
  learning_rate: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 5.0e-4
  grad_clip: 2.0
  val_every_n_epochs: 1
  save_every_n_epochs: 3
  use_weighted_sampler: true      # worth enabling given severe fire/background imbalance

evaluation:
  threshold: 0.5
  low_threshold: 0.3
  compute_ipsnr: true
  pixel_size_m: 384.0             # VIIRS
  log_postprocessed: true

postprocess:
  method: otsu
  percentile: 99.5
  fixed_threshold: 0.5
  min_component_size: 4

checkpointing:
  checkpoint_dir: checkpoints
  gcs_checkpoint_prefix: processed_dataset_gcp/checkpoints/e2_haunet_cascaded_stage1_focal_dice
  keep_last_n: 1
  best_metric: [val_auprc, val_soft_iou]

logging:
  log_dir: logs
  use_wandb: false

loss:
  type: focal_dice
  alpha: 0.85
  gamma: 1.5
  focal_weight: 1.0
  dice_weight: 1.0
  smooth: 0.001

