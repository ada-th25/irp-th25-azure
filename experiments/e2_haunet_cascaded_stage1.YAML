# experiments/e2_haunet_cascaded_stage1.YAML
# ===================================
# Stage 1 of the cascaded pipeline (GOES -> VIIRS), HAUNet

# ==================================================================
# e2 haunet cascaded stage1 focal dice, TUNED via sweep_stage1.py
# (2 clean rounds, 24 trials total, dilate_target pinned False throughout)
#
# Sweep conclusion: focal_dice remained the best loss family (highest
# mean val_auprc across 12 trials, highest single best result 0.1304,
# tighter variance than focal_tversky/gaussian_focal). Best trial's
# hyperparameters used below, with learning_rate set to a moderate
# compromise (2.5e-4) between e2's proven 1.0e-4 and the sweep
# winner's 4.5e-4, since the winning LR was only validated over 3
# epochs on a small split -- watch early epochs for instability.
# ==================================================================
experiment:
  name: e2_haunet_cascaded_stage1_focal_dice_tuned
  branch: viirs
 
data:
  bucket_name: wildfire-irp-data-th25
  output_prefix: processed_dataset_gcp
  splits_dir: splits              # <- full 80/10/10 split, regenerated after backfill + enrich_manifests
  heatmap_sigma: 1.2              # unused when heatmap_target: false, harmless to leave
  goes_mean: [302.08500199571023, 293.31448659302816, 8.77051540268201] # GOES stats calculated only from the train dataset
  goes_std: [14.294826189509713, 11.448781247485242, 7.395100429456481]
  dem_mean: [0.376221329381606]
  dem_std: [0.5567604718401954]
  heatmap_target: false           # focal_dice expects a binary {0,1} target
  dilate_target: false            # pinned False throughout the sweep -- confirmed not helpful
  goes_channels: 3
  cov_channels: 11
  num_workers: 4
  use_stage1_pred: false
  stage1_channels: 0
 
model:
  name: haunet
  drop_out_rate: 0.1
  # prior_fire_fraction: <measured VIIRS positive-pixel fraction>
  # defaults to 0.0085 if omitted
 
training:
  batch_size: 2
  grad_accum_steps: 4             # effective batch size = 2 * 4 = 8
  epochs: 20
  learning_rate: 2.5e-4           # TUNED -- up from e2's 1.0e-4; sweep winner used 4.5e-4 but that's
                                   # untested at full epoch count, so this is a moderate step up instead
  min_lr: 1.0e-6
  weight_decay: 5.0e-4
  grad_clip: 2.0
  val_every_n_epochs: 1
  save_every_n_epochs: 3
  use_weighted_sampler: true      # worth enabling given severe fire/background imbalance
 
evaluation:
  threshold: 0.5
  low_threshold: 0.3
  compute_ipsnr: true
  pixel_size_m: 384.0             # VIIRS
  log_postprocessed: true
 
postprocess:
  method: otsu
  percentile: 99.5
  fixed_threshold: 0.5
  min_component_size: 4
 
checkpointing:
  checkpoint_dir: checkpoints
  gcs_checkpoint_prefix: processed_dataset_gcp/checkpoints/e2_haunet_cascaded_stage1_focal_dice_tuned
  keep_last_n: 1
  best_metric: [val_auprc, val_soft_iou]
 
logging:
  log_dir: logs
  use_wandb: false
 
loss:
  type: focal_dice
  alpha: 0.888                    # TUNED -- sweep winner (e2 was 0.85)
  gamma: 1.765                    # TUNED -- sweep winner (e2 was 1.5)
  focal_weight: 1.0
  dice_weight: 1.007              # TUNED -- sweep winner (e2 was 1.0)
  smooth: 0.001

